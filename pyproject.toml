[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "disaster-flow-response"
version = "0.1.0"
description = "Structured disaster flow responses with causal shared-readout adaptation"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24,<3", "torch>=2.2"]

[tool.setuptools.packages.find]
include = ["disaster_response*"]

